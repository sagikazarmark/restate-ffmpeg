[package]
name = "restate-ffmpeg"
version.workspace = true
description = "FFmpeg service for Restate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
content_disposition = "0.4.0"
futures = "0.3"
http = "1.4.0"
humantime-serde = { workspace = true }
jiff = "0.2.18"
opendal = { workspace = true, features = [ "services-memory", "services-fs" ] }
opendal-util = { workspace = true }
restate-sdk = { workspace = true, features = ["hyper", "schemars"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["process"] }
tokio-util = { version = "0.7.18", features = ["compat", "tracing"] }
typed-path = "0.12.2"
url = { workspace = true }
