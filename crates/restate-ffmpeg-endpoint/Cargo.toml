[package]
name = "restate-ffmpeg-endpoint"
version.workspace = true
description = "Standalone endpoint hosting the FFmpeg service for Restate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "restate-ffmpeg"
path = "src/main.rs"
doc = false

[dependencies]
restate-ffmpeg = { workspace = true }

anyhow = { workspace = true }
clap = { version = "4.5.56", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["env", "json", "toml", "yaml"] }
humantime-serde = { workspace = true }
opendal = { workspace = true, features = [
  "services-http",
  "services-s3",
  "services-azblob",
  "services-gcs",
  "services-memory",
  "layers-tracing",
  "layers-mime-guess",
] }
opendal-util = { workspace = true }
restate-sdk = { workspace = true, features = [
  "http_server",
  "rust_crypto",
  "tracing-span-filter",
] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
