[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/sagikazarmark/restate-ffmpeg"
homepage = "https://github.com/sagikazarmark/restate-ffmpeg"

[workspace.dependencies]
restate-ffmpeg = { path = "crates/restate-ffmpeg" }

anyhow = "1.0"
humantime-serde = "1.1.1"
opendal = "0.58"
opendal-util = "0.7"
schemars = { version = "1.2", features = ["jiff02", "url2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
restate-sdk = { version = "0.11", default-features = false }
url = { version = "2.5", features = ["serde"] }

[workspace.metadata.release]
publish = false
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
